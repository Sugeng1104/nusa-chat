<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daftar | PASURA Chat</title><link rel="stylesheet" href="css/style.css"><link rel="manifest" href="manifest.webmanifest"></head><body><main class="auth panel"><div class="logo">PASURA Chat</div><h1>Registrasi anggota</h1><p class="muted">Setelah verifikasi email, akun harus disetujui admin.</p><form id="registerForm"><label for="name">Nama lengkap</label><input id="name" required minlength="2"><label for="org">Instansi</label><select id="org" required><option value="">Memuat instansi...</option></select><label for="registrationCode">Kode Pendaftaran Instansi</label><input id="registrationCode" required minlength="12" maxlength="12" autocomplete="off" autocapitalize="characters" placeholder="12 karakter dari admin"><p class="muted">Minta kode kepada administrator instansi. Kode tidak ditampilkan untuk umum.</p><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><label for="password">Password (min. 6 karakter)</label><input id="password" type="password" autocomplete="new-password" minlength="6" required><button>Daftar</button></form><p id="message" role="status"></p><p>Sudah terdaftar? <a href="login.html">Masuk</a></p></main><script type="module" src="js/app.js?v=adminpro1"></script></body></html>
