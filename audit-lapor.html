<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Serahkan Bukti Audit | PASURA Chat</title><style>body{font:16px system-ui;background:#f1f7f2;color:#163e2b;margin:0}main{max-width:700px;margin:35px auto;padding:25px;background:white;border-radius:16px}label{display:block;margin-top:15px;font-weight:700}input,textarea,select{display:block;width:100%;box-sizing:border-box;padding:11px;margin-top:6px}button{padding:12px;background:#087750;color:white;border:0;border-radius:8px;margin-top:18px}p{line-height:1.5}</style></head><body><main><a href="chat.html">← Kembali ke PASURA Chat</a><h1>Penyerahan Bukti Audit</h1><p>Formulir ini hanya untuk peserta percakapan yang menyerahkan bukti secara sadar. Bukti yang diketik/disalin belum diverifikasi terhadap pesan asli. Jangan serahkan informasi di luar kewenangan Anda.</p><form id="reportForm"><label>ID kasus audit<input id="caseId" required placeholder="ID kasus dari petugas audit"></label><label>Jenis percakapan<select id="sourceType"><option value="private">Pribadi</option><option value="group">Grup</option></select></label><label>ID percakapan / grup<input id="sourceId" required placeholder="ID percakapan yang Anda ikuti"></label><label>Isi pesan yang diserahkan<textarea id="content" required minlength="1" maxlength="2000" rows="7" placeholder="Salin pesan yang relevan"></textarea></label><label><input type="checkbox" id="consent" required style="width:auto;display:inline"> Saya menyerahkan bukti ini untuk pemeriksaan kasus yang disebutkan.</label><button type="submit">Serahkan bukti</button></form><p id="message" role="status"></p></main><script type="module" src="js/audit-lapor.js?v=2"></script></body></html>
