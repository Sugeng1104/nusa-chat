<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Masuk | NUSA CHAT</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <main class="auth panel">
    <div class="logo">NUSA CHAT</div>
    <h1>Masuk ke akun</h1>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">Masuk</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
    <button class="secondary" id="sendVerification" type="button" hidden>Kirim Email Verifikasi</button>
    <button class="secondary" id="loginCheck" type="button">Periksa status akun</button>
    <p>Belum punya akun? <a href="register.html">Daftar</a></p>
  </main>
  <script type="module" src="js/app.js?v=20261010-2"></script>
</body>
</html>
