<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Percakapan | NUSA CHAT</title><link rel="stylesheet" href="css/style.css"><link rel="manifest" href="manifest.webmanifest"><style>
.chat-layout{display:grid;grid-template-columns:minmax(250px,340px) 1fr;min-height:70vh;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 12px 30px #073d3120}.chat-side{background:#f3f8f6;border-right:1px solid #dbe8e2;padding:20px}.chat-side input{width:100%;box-sizing:border-box}.contact{display:block;width:100%;text-align:left;background:white;color:#103c32;border:1px solid #e0ebe6;border-radius:12px;margin:8px 0;padding:12px;cursor:pointer}.contact:hover,.contact.selected{background:#d9f1e7}.contact small{display:block;color:#54766a;margin-top:4px}.chat-main{display:flex;flex-direction:column;min-height:60vh}.chat-top{padding:18px 22px;border-bottom:1px solid #e4ede8;font-weight:700}.chat-messages{flex:1;padding:22px;overflow-y:auto;max-height:58vh;display:flex;flex-direction:column;gap:10px;background:#fbfdfc}.bubble{max-width:75%;align-self:flex-start;background:#eaf2ee;padding:10px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:#d1f2df}.bubble time{display:block;font-size:11px;opacity:.65;margin-top:4px}.chat-compose{display:flex;gap:10px;padding:15px;border-top:1px solid #e4ede8}.chat-compose input{flex:1;min-width:0}.chat-compose button{width:auto}.emoji-wrap{position:relative;display:flex;align-items:center}.emoji-trigger{background:#e3f1eb;color:#075f4b;border:1px solid #bfd9ce;border-radius:12px;padding:10px 13px;font-size:24px;line-height:1;cursor:pointer}.emoji-trigger:disabled{opacity:.45;cursor:not-allowed}.emoji-picker{position:absolute;bottom:calc(100% + 12px);left:0;width:min(290px,80vw);max-height:235px;overflow-y:auto;display:grid;grid-template-columns:repeat(6,1fr);gap:3px;background:#fff;border:1px solid #cdded5;border-radius:14px;padding:10px;box-shadow:0 12px 30px #0002;z-index:20}.emoji-picker[hidden]{display:none}.emoji-choice{background:transparent!important;border:0!important;padding:7px!important;font-size:23px;line-height:1.2;cursor:pointer}.emoji-choice:hover,.emoji-choice:focus-visible{background:#e2f4ea!important}.emoji-picker-title{grid-column:1/-1;font-size:13px;font-weight:700;color:#476b60;padding:4px}.chat-compose .emoji-trigger{width:auto}.contact{position:relative}.unread-mark{position:absolute;right:12px;top:12px;background:#dc2626;color:white;border-radius:50%;width:23px;height:23px;display:grid;place-items:center;font-weight:800;font-size:15px}.group-button{width:auto!important;padding:8px 12px!important}.side-heading{display:flex;align-items:center;justify-content:space-between;gap:8px}.group-dialog{border:1px solid #cdded5;border-radius:16px;max-width:min(450px,90vw);padding:24px}.group-dialog::backdrop{background:#0008}.group-list{max-height:230px;overflow:auto;display:grid;gap:10px;margin:14px 0}.group-list label{display:flex;gap:8px;align-items:center}.group-list input{width:auto}.group-list span{overflow-wrap:anywhere}.group-actions{display:flex;gap:8px;justify-content:flex-end}.group-actions button{width:auto}.chat-empty{color:#607c71;text-align:center;margin:auto}.chat-status{padding:8px 20px;color:#9a3412;min-height:20px}@media(max-width:680px){.chat-layout{grid-template-columns:1fr}.chat-side{border-right:0;border-bottom:1px solid #dbe8e2}.chat-main{min-height:55vh}.chat-messages{max-height:45vh}}

/* Tema hijau daun pisang muda - khusus halaman chat */
body#chatPage{background:linear-gradient(145deg,#ecf8d8 0%,#d5eeac 54%,#b9df86 100%);min-height:100vh;color:#23452b}
#chatPage header{background:#d8edb2;border-bottom:1px solid #a8cb80}

</style></head><body id="chatPage"><header><a href="index.html">NUSA CHAT</a><button id="logout" class="secondary" type="button">Keluar</button></header><main><h1 id="welcome">Memuat akun...</h1><div class="chat-layout"><aside class="chat-side"><div class="side-heading"><h2>Kontak & Grup</h2><button id="createGroup" type="button" class="group-button" title="Buat grup percakapan" aria-label="Buat grup"><svg xmlns="http://www.w3.org/2000/svg" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M19 8v6m-3-3h6"/></svg></button></div><div id="notificationSummary" aria-live="polite" class="nc-muted"></div><label for="contactSearch">Cari pengguna</label><input id="contactSearch" placeholder="Cari nama atau instansi" autocomplete="off"><div id="contacts">Memuat kontak...</div><h3>Grup saya</h3><div id="groups">Memuat grup...</div></aside><section class="chat-main" aria-label="Ruang percakapan"><div class="chat-top" id="chatWith">Pilih kontak untuk mulai percakapan</div><div class="chat-messages" id="messages"><p class="chat-empty">Pesan pribadi NUSA CHAT</p></div><p id="chatStatus" class="chat-status" role="status" aria-live="polite"></p><form class="chat-compose" id="messageForm"><div class="emoji-wrap"><button id="emojiToggle" class="emoji-trigger" type="button" aria-label="Tambahkan emoji" aria-expanded="false" aria-controls="emojiPicker" title="Tambahkan emoji" disabled>😊</button><div id="emojiPicker" class="emoji-picker" role="group" aria-label="Pilih emoji" hidden></div></div><input id="messageText" maxlength="2000" placeholder="Tulis pesan..." aria-label="Isi pesan" required disabled><button id="sendMessage" type="submit" disabled>Kirim</button></form></section></div></main><dialog id="groupDialog" class="group-dialog"><form id="groupForm"><h2>Buat grup percakapan</h2><label for="groupName">Nama grup</label><input id="groupName" required minlength="3" maxlength="80" placeholder="Contoh: Guru Kelas 4"><p>Pilih minimal satu anggota selain Anda:</p><div id="groupMembers" class="group-list"></div><div class="group-actions"><button id="cancelGroup" type="button" class="secondary">Batal</button><button type="submit">Buat grup</button></div></form></dialog><script type="module" src="js/chat.js?v=13-notif-group-1"></script></body></html>
