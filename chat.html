<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Percakapan | NUSA CHAT</title><link rel="stylesheet" href="css/style.css"><link rel="manifest" href="manifest.webmanifest"><style>
.chat-layout{display:grid;grid-template-columns:minmax(250px,340px) 1fr;min-height:70vh;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 12px 30px #073d3120}.chat-side{background:#f3f8f6;border-right:1px solid #dbe8e2;padding:20px}.chat-side input{width:100%;box-sizing:border-box}.contact{display:block;width:100%;text-align:left;background:white;color:#103c32;border:1px solid #e0ebe6;border-radius:12px;margin:8px 0;padding:12px;cursor:pointer}.contact:hover,.contact.selected{background:#d9f1e7}.contact small{display:block;color:#54766a;margin-top:4px}.chat-main{display:flex;flex-direction:column;min-height:60vh}.chat-top{padding:18px 22px;border-bottom:1px solid #e4ede8;font-weight:700}.chat-messages{flex:1;padding:22px;overflow-y:auto;max-height:58vh;display:flex;flex-direction:column;gap:10px;background:#fbfdfc}.bubble{max-width:75%;align-self:flex-start;background:#eaf2ee;padding:10px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:#d1f2df}.bubble time{display:block;font-size:11px;opacity:.65;margin-top:4px}.chat-compose{display:flex;gap:10px;padding:15px;border-top:1px solid #e4ede8}.chat-compose input{flex:1;min-width:0}.chat-compose button{width:auto}.emoji-wrap{position:relative;display:flex;align-items:center}.emoji-trigger{background:#e3f1eb;color:#075f4b;border:1px solid #bfd9ce;border-radius:12px;padding:10px 13px;font-size:24px;line-height:1;cursor:pointer}.emoji-trigger:disabled{opacity:.45;cursor:not-allowed}.emoji-picker{position:absolute;bottom:calc(100% + 12px);left:0;width:min(290px,80vw);max-height:235px;overflow-y:auto;display:grid;grid-template-columns:repeat(6,1fr);gap:3px;background:#fff;border:1px solid #cdded5;border-radius:14px;padding:10px;box-shadow:0 12px 30px #0002;z-index:20}.emoji-picker[hidden]{display:none}.emoji-choice{background:transparent!important;border:0!important;padding:7px!important;font-size:23px;line-height:1.2;cursor:pointer}.emoji-choice:hover,.emoji-choice:focus-visible{background:#e2f4ea!important}.emoji-picker-title{grid-column:1/-1;font-size:13px;font-weight:700;color:#476b60;padding:4px}.chat-compose .emoji-trigger{width:auto}.chat-empty{color:#607c71;text-align:center;margin:auto}.chat-status{padding:8px 20px;color:#9a3412;min-height:20px}@media(max-width:680px){.chat-layout{grid-template-columns:1fr}.chat-side{border-right:0;border-bottom:1px solid #dbe8e2}.chat-main{min-height:55vh}.chat-messages{max-height:45vh}}
</style></head><body id="chatPage"><header><a href="index.html">NUSA CHAT</a><button id="logout" class="secondary" type="button">Keluar</button></header><main><h1 id="welcome">Memuat akun...</h1><div class="chat-layout"><aside class="chat-side"><h2>Kontak aktif</h2><label for="contactSearch">Cari pengguna</label><input id="contactSearch" placeholder="Cari nama atau instansi" autocomplete="off"><div id="contacts">Memuat kontak...</div></aside><section class="chat-main" aria-label="Ruang percakapan"><div class="chat-top" id="chatWith">Pilih kontak untuk mulai percakapan</div><div class="chat-messages" id="messages"><p class="chat-empty">Pesan pribadi NUSA CHAT</p></div><p id="chatStatus" class="chat-status" role="status" aria-live="polite"></p><form class="chat-compose" id="messageForm"><div class="emoji-wrap"><button id="emojiToggle" class="emoji-trigger" type="button" aria-label="Tambahkan emoji" aria-expanded="false" aria-controls="emojiPicker" title="Tambahkan emoji" disabled>😊</button><div id="emojiPicker" class="emoji-picker" role="group" aria-label="Pilih emoji" hidden></div></div><input id="messageText" maxlength="2000" placeholder="Tulis pesan..." aria-label="Isi pesan" required disabled><button id="sendMessage" type="submit" disabled>Kirim</button></form></section></div></main><script type="module" src="js/chat.js?v=12-emoji-1"></script></body></html>
